spring.application.name=fitness-tracker

# --- Database Configuration (MySQL) ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.url=jdbc:mysql://localhost:3306/fitnessdb

# --- Hibernate / JPA Settings ---
# 'update' automatically creates/updates tables based on your Entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.jpa.properties.hibernate.type.json_format_mapper=jackson
